services:
  postgres:
    image: postgres:16
    container_name: plavor-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plavor}
      POSTGRES_USER: ${POSTGRES_USER:-plavor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - plavor-prod-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: plavor-prod-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-plavor}
      DB_USERNAME: ${POSTGRES_USER:-plavor}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:?KAKAO_REST_API_KEY is required}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:?KAKAO_CLIENT_SECRET is required}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:?KAKAO_REDIRECT_URI is required}
    ports:
      - "${BACKEND_PORT:-127.0.0.1:8080}:8080"

  caddy:
    image: caddy:2-alpine
    container_name: plavor-caddy
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PLAVOR_DOMAIN: ${PLAVOR_DOMAIN:?PLAVOR_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv/plavor/frontend/dist:ro
      - plavor-caddy-data:/data
      - plavor-caddy-config:/config

volumes:
  plavor-prod-postgres-data:
  plavor-caddy-data:
  plavor-caddy-config:
